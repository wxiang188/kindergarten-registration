<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幼儿园报名缴费系统 - 园长端管理后台</title>
<style>
:root {
    --primary: #1677FF; --primary-hover: #4096FF; --primary-active: #0958D9; --primary-bg: #E6F4FF;
    --success: #52C41A; --warning: #FAAD14; --error: #FF4D4F;
    --text-primary: rgba(0,0,0,0.88); --text-secondary: rgba(0,0,0,0.65); --text-tertiary: rgba(0,0,0,0.45);
    --border: #D9D9D9; --border-split: #F0F0F0; --bg-container: #FFF; --bg-layout: #F5F5F5;
    --font: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;
    --radius: 6px; --radius-lg: 8px; --shadow: 0 6px 16px rgba(0,0,0,0.08);
    --header-h: 48px; --sider-w: 220px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;color:var(--text-primary);background:var(--bg-layout);line-height:1.5714}
/* === Admin Header === */
header{height:var(--header-h);background:#001529;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;top:0;left:0;right:0;z-index:100}
header .logo{display:flex;align-items:center;gap:8px;color:#fff;font-size:16px;font-weight:600}
header .logo svg{width:24px;height:24px}
header .header-right{display:flex;align-items:center;gap:16px;color:rgba(255,255,255,0.85)}
header .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
header .role-switch{color:rgba(255,255,255,0.65);font-size:13px;cursor:pointer;padding:4px 12px;border-radius:4px;border:1px solid rgba(255,255,255,0.25);position:relative}
header .role-dropdown{position:absolute;top:36px;right:0;background:#fff;color:var(--text-primary);border-radius:var(--radius);box-shadow:var(--shadow);min-width:120px;display:none;padding:4px 0}
header .role-dropdown.show{display:block}
header .role-dropdown .opt{padding:8px 16px;cursor:pointer;font-size:13px}
header .role-dropdown .opt:hover{background:var(--primary-bg);color:var(--primary)}
header .role-dropdown .opt.active{color:var(--primary);font-weight:600}
/* === Admin Sider === */
.layout{display:flex;margin-top:var(--header-h);min-height:calc(100vh - var(--header-h))}
.sider{width:var(--sider-w);background:#001529;padding-top:8px;flex-shrink:0;overflow-y:auto;position:fixed;top:var(--header-h);bottom:0;left:0}
.sider .menu-group{margin-bottom:4px}
.sider .menu-group-title{color:rgba(255,255,255,0.35);font-size:12px;padding:12px 24px 4px;text-transform:uppercase;letter-spacing:1px}
.sider .menu-item{display:flex;align-items:center;gap:10px;padding:10px 24px;color:rgba(255,255,255,0.65);font-size:14px;cursor:pointer;transition:all 0.2s;border-left:3px solid transparent}
.sider .menu-item:hover{color:#fff;background:rgba(255,255,255,0.04)}
.sider .menu-item.active{color:#fff;background:var(--primary);border-left-color:#fff}
/* === Content === */
.main-content{margin-left:var(--sider-w);flex:1;padding:24px;background:var(--bg-layout);min-height:calc(100vh - var(--header-h))}
.page{display:none}
.page.active{display:block}
.page-title{font-size:20px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.breadcrumb{font-size:14px;color:var(--text-tertiary);margin-bottom:16px}
.breadcrumb span{cursor:pointer}
.breadcrumb span:hover{color:var(--primary)}
.breadcrumb .sep{margin:0 8px;color:var(--text-quaternary)}
.breadcrumb .current{color:var(--text-primary)}
/* === Cards === */
.card{background:var(--bg-container);border-radius:var(--radius-lg);padding:24px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat-card{background:var(--bg-container);border-radius:var(--radius-lg);padding:20px 24px}
.stat-card .label{font-size:14px;color:var(--text-secondary);margin-bottom:8px}
.stat-card .value{font-size:28px;font-weight:600;color:var(--text-primary)}
.stat-card .sub{font-size:12px;color:var(--text-tertiary);margin-top:4px}
/* === Search === */
.search-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.search-item{display:flex;flex-direction:column;gap:4px}
.search-item label{font-size:13px;color:var(--text-secondary)}
.search-item input,.search-item select{height:32px;border:1px solid var(--border);border-radius:var(--radius);padding:0 11px;font-size:14px;font-family:var(--font);min-width:160px}
.search-item input:focus,.search-item select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,0.1)}
/* === Buttons === */
.btn{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 15px;border-radius:var(--radius);font-size:14px;font-family:var(--font);cursor:pointer;border:1px solid transparent;transition:all 0.2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-default{background:#fff;color:var(--text-primary);border-color:var(--border)}
.btn-default:hover{color:var(--primary);border-color:var(--primary)}
.btn-danger{background:#fff;color:var(--error);border-color:var(--error)}
.btn-danger:hover{background:var(--error);color:#fff}
.btn-text{background:transparent;border:none;color:var(--primary);padding:0 8px}
.btn-sm{height:26px;font-size:12px;padding:0 10px}
.btn-lg{height:40px;padding:0 24px;font-size:16px}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-group{display:flex;gap:8px}
/* === Table === */
table{width:100%;border-collapse:collapse}
th{background:#FAFAFA;padding:12px 16px;text-align:left;font-weight:600;font-size:14px;color:var(--text-primary);border-bottom:1px solid var(--border-split)}
td{padding:12px 16px;border-bottom:1px solid var(--border-split);font-size:14px}
tr:hover td{background:#FAFAFA}
tr.selected td{background:var(--primary-bg)}
.actions a{color:var(--primary);text-decoration:none;cursor:pointer;font-size:13px}
.actions a:hover{color:var(--primary-hover)}
.actions a.danger{color:var(--error)}
.actions .divider{color:var(--border);margin:0 4px}
/* === Tags === */
.tag{display:inline-block;height:22px;line-height:22px;padding:0 7px;border-radius:4px;font-size:12px;border:1px solid}
.tag-blue{background:var(--primary-bg);border-color:#91CAFF;color:var(--primary)}
.tag-green{background:#F6FFED;border-color:#B7EB8F;color:#52C41A}
.tag-orange{background:#FFF7E6;border-color:#FFD591;color:#FA8C16}
.tag-red{background:#FFF2F0;border-color:#FFCCC7;color:#FF4D4F}
.tag-gray{background:#FAFAFA;border-color:#D9D9D9;color:var(--text-secondary)}
/* === Forms === */
.form-item{margin-bottom:20px;display:flex;align-items:flex-start}
.form-label{width:120px;text-align:right;padding-right:12px;line-height:32px;font-size:14px;color:var(--text-primary);flex-shrink:0}
.form-label.required::before{content:'*';color:var(--error);margin-right:4px}
.form-control{flex:1}
.form-input,.form-select,.form-textarea{width:100%;max-width:400px;height:32px;border:1px solid var(--border);border-radius:var(--radius);padding:0 11px;font-size:14px;font-family:var(--font)}
.form-textarea{height:80px;resize:vertical;padding:8px 11px}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,0.1)}
.form-error .form-input,.form-error .form-select{border-color:var(--error)}
.form-error .error-text{color:var(--error);font-size:12px;margin-top:4px}
.radio-group{display:flex;gap:16px;line-height:32px}
.radio-group label{display:flex;align-items:center;gap:4px;cursor:pointer}
.upload-area{width:104px;height:104px;border:1px dashed var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;color:var(--text-tertiary)}
.upload-area:hover{border-color:var(--primary);color:var(--primary)}
/* === Modal === */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:210;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);width:520px;max-height:80vh;overflow-y:auto}
.modal-header{padding:16px 24px;border-bottom:1px solid var(--border-split);display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600}
.modal-close{cursor:pointer;font-size:20px;color:var(--text-tertiary)}
.modal-body{padding:24px}
.modal-footer{padding:10px 16px;border-top:1px solid var(--border-split);display:flex;justify-content:flex-end;gap:8px}
/* === Drawer === */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:none}
.drawer-overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;width:480px;min-width:320px;max-width:90vw;height:100%;background:#fff;z-index:201;box-shadow:-6px 0 16px rgba(0,0,0,0.08);overflow-y:auto;transform:translateX(100%);transition:transform 0.3s}
.drawer.open{transform:translateX(0)}
.drawer.resizing{transition:none!important;user-select:none}
.drawer-header{padding:16px 24px;border-bottom:1px solid var(--border-split);display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600}
.drawer-body{padding:24px}
.drawer-footer{padding:10px 16px;border-top:1px solid var(--border-split);display:flex;justify-content:flex-end;gap:8px}
.drawer-resize-handle{position:absolute;top:0;left:0;width:6px;height:100%;cursor:ew-resize;background:transparent;z-index:10}
.drawer-resize-handle:hover,.drawer-resize-handle:active{background:var(--primary);opacity:0.6}
/* === Toast === */
#toast-container{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 20px;border-radius:var(--radius-lg);box-shadow:var(--shadow);font-size:14px;animation:fadeIn 0.3s}
.toast.success{background:#F6FFED;border:1px solid #B7EB8F;color:#52C41A}
.toast.error{background:#FFF2F0;border:1px solid #FFCCC7;color:#FF4D4F}
.toast.info{background:var(--primary-bg);border:1px solid #91CAFF;color:var(--primary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
/* === Pagination === */
.pagination{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px;font-size:14px;color:var(--text-secondary)}
.pagination .pages{display:flex;gap:4px}
.pagination .page-num{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);cursor:pointer;border:1px solid var(--border)}
.pagination .page-num.active{border-color:var(--primary);color:var(--primary)}
.pagination .page-num:hover{border-color:var(--primary)}
.pagination .page-divider{color:var(--border)}
.pagination .page-goto{display:flex;align-items:center;gap:4px}
.pagination .page-goto input{width:56px;height:28px;border:1px solid var(--border);border-radius:var(--radius);padding:0 6px;text-align:center;font-size:13px}
.pagination .page-goto input:focus{outline:none;border-color:var(--primary)}
.table-actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
/* === Empty state === */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-tertiary)}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:0.3}
/* === Timeline === */
.timeline{padding-left:24px;border-left:2px solid var(--border-split)}
.timeline-item{padding:8px 0 8px 20px;position:relative}
.timeline-item::before{content:'';position:absolute;left:-29px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--border);border:2px solid #fff}
.timeline-item.done::before{background:var(--success)}
.timeline-item.active::before{background:var(--primary);box-shadow:0 0 0 4px rgba(22,119,255,0.2);animation:pulse 2s infinite}
.timeline-item.fail::before{background:var(--error)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(22,119,255,0.2)}50%{box-shadow:0 0 0 8px rgba(22,119,255,0.1)}}
/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--border-split);margin-bottom:16px}
.tab-item{padding:8px 16px;cursor:pointer;font-size:14px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-item.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
</style>
</head>
<body>

<!-- ========== ADMIN HEADER ========== -->
<header id="admin-header">
    <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="1" width="18" height="22" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="18" x2="12" y2="18"/></svg>
        幼儿园报名缴费系统
    </div>
    <div class="header-right">
        <div style="color:rgba(255,255,255,0.85);font-size:13px"><b>园长 (PC后台)</b></div>
        <div class="user-avatar" id="user-avatar">园</div>
    </div>
</header>

<!-- ========== ADMIN LAYOUT ========== -->
<div class="layout" id="admin-layout">
    <aside class="sider" id="admin-sider">
        <div class="menu-group">
            <div class="menu-group-title">报名管理</div>
            <div class="menu-item active" data-page="review-list" onclick="navTo('review-list')">📋 入学报名审核</div>
            <div class="menu-item" data-page="student-archive" onclick="navTo('student-archive')">👨‍🎓 学生档案管理</div>
        </div>
        <div class="menu-group">
            <div class="menu-group-title">财务管理</div>
            <div class="menu-item" data-page="payment-manage" onclick="navTo('payment-manage')">💰 收费管理</div>
            <div class="menu-item" data-page="bill-info" onclick="navTo('bill-info')">📊 流水明细</div>
            <div class="menu-item" data-page="invoice-manage" onclick="navTo('invoice-manage')">🧾 开票管理</div>
        </div>
        <div class="menu-group">
            <div class="menu-group-title">系统设置</div>
            <div class="menu-item" data-page="semester-manage" onclick="navTo('semester-manage')">📅 学期管理</div>
            <div class="menu-item" data-page="fee-settings" onclick="navTo('fee-settings')">💰 费用设置</div>
            <div class="menu-item" data-page="enroll-window" onclick="navTo('enroll-window')">⏰ 报名时间设置</div>
        </div>
    </aside>
    <main class="main-content" id="admin-content"></main>
</div>

<!-- H5 layout removed -->
<!-- ========== MODAL & DRAWER ========== -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-box">
        <div class="modal-header"><span class="modal-title" id="modal-title"></span><span class="modal-close" onclick="closeModal()">&times;</span></div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
    </div>
</div>
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer-box">
    <div class="drawer-resize-handle" id="drawer-resize-handle"></div>
    <div class="drawer-header"><span id="drawer-title"></span><span style="cursor:pointer;font-size:20px" onclick="closeDrawer()">&times;</span></div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-footer" id="drawer-footer"></div>
</div>
<div id="toast-container"></div>

<script>
// ========== GLOBAL STATE ==========
let currentRole = 'principal';

// ========== ADMIN NAVIGATION ==========
function navTo(pageId){
    document.querySelectorAll('#admin-sider .menu-item').forEach(m=>m.classList.remove('active'));
    const menuItem = document.querySelector(`[data-page="${pageId}"]`);
    if(menuItem) menuItem.classList.add('active');
    document.getElementById('admin-content').innerHTML = renderAdminPage(pageId);
}

// ========== MODAL / DRAWER ==========
function openModal(title, bodyHtml, footerHtml){
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHtml;
    document.getElementById('modal-footer').innerHTML = footerHtml || '<button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="closeModal();toast(\'操作成功\',\'success\')">确认</button>';
    document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show')}
function openDrawer(title, bodyHtml, footerHtml){
    document.getElementById('drawer-title').textContent = title;
    document.getElementById('drawer-body').innerHTML = bodyHtml;
    document.getElementById('drawer-footer').innerHTML = footerHtml || '<button class="btn btn-default" onclick="closeDrawer()">取消</button><button class="btn btn-primary" onclick="closeDrawer();toast(\'操作成功\',\'success\')">确认</button>';
    document.getElementById('drawer-overlay').classList.add('show');
    document.getElementById('drawer-box').classList.add('open');
}
function closeDrawer(){
    document.getElementById('drawer-overlay').classList.remove('show');
    document.getElementById('drawer-box').classList.remove('open');
}

// ========== DRAWER RESIZE ==========
(function(){
    const handle = document.getElementById('drawer-resize-handle');
    const drawer = document.getElementById('drawer-box');
    let startX, startW;
    function onStart(e){
        startX = e.clientX;
        startW = drawer.offsetWidth;
        drawer.classList.add('resizing');
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        e.preventDefault();
    }
    function onMove(e){
        const w = startW - (e.clientX - startX);
        drawer.style.width = Math.max(320, Math.min(window.innerWidth*0.9, w)) + 'px';
    }
    function onEnd(){
        drawer.classList.remove('resizing');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
    }
    handle.addEventListener('mousedown', onStart);
})();

// ========== TOAST ==========
function toast(msg, type){
    type = type || 'info';
    const el = document.createElement('div'); el.className = 'toast '+type; el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(()=>el.remove(), 2500);
}

// ========== ADMIN PAGE RENDERERS ==========
function tHead(cols){return '<thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead>'}
function tag(s,l){const m={蓝:'blue',绿:'green',橙:'orange',红:'red',灰:'gray',黄:'orange'};return `<span class="tag tag-${m[l]||'gray'}">${s}</span>`}

function renderAdminPage(id){
    switch(id){
        case 'review-list': return renderReviewList();
        case 'student-archive': return renderStudentArchive();
        case 'payment-manage': return renderPaymentManage();
        case 'bill-info': return renderBillInfo();
        case 'invoice-manage': return renderInvoiceManage();
        case 'semester-manage': return renderSemesterManage();
        case 'fee-settings': return renderFeeSettings();
        case 'enroll-window': return renderEnrollWindow();
        default: return '<div class="empty-state"><div class="icon">🚧</div>功能开发中</div>';
    }
}

// -- 报名审核 --
function renderReviewList(){
    let h=`<div class="page-title">入学报名审核</div>`;
    h+=`<div class="card"><div class="search-bar" style="gap:12px">
        <div class="search-item" style="flex-direction:row;align-items:center;gap:6px"><label style="white-space:nowrap;font-size:13px">幼儿姓名</label><input placeholder="模糊搜索" style="width:130px"></div>
        <div class="search-item" style="flex-direction:row;align-items:center;gap:6px"><label style="white-space:nowrap;font-size:13px">入园年份</label><select style="width:90px"><option>全部</option><option>2026</option><option>2025</option><option>2024</option></select></div>
        <div class="search-item" style="flex-direction:row;align-items:center;gap:6px"><label style="white-space:nowrap;font-size:13px">出生日期</label><input type="date" style="width:130px"> <span style="color:var(--text-tertiary)">—</span> <input type="date" style="width:130px"></div>
        <div class="search-item" style="flex-direction:row;align-items:center;gap:6px"><label style="white-space:nowrap;font-size:13px">申请人姓名</label><input placeholder="模糊搜索" style="width:120px"></div>
        <div class="search-item" style="flex-direction:row;align-items:center;gap:6px"><label style="white-space:nowrap;font-size:13px">审核结果</label><select style="width:100px"><option>全部</option><option>待审核</option><option>已通过</option><option>已驳回</option></select></div>
        <div class="search-item" style="flex-direction:row;align-items:center;gap:6px"><label style="white-space:nowrap;font-size:13px">申请时间</label><input type="date" style="width:130px"> <span style="color:var(--text-tertiary)">—</span> <input type="date" style="width:130px"></div>
        <button class="btn btn-primary btn-sm">搜索</button>
        <button class="btn btn-default btn-sm">重置</button>
    </div></div>`;
    const cols = ['申请日期','幼儿姓名','幼儿性别','出生地','出生日期','证件类型','证件号','国籍','民族','籍贯','户口所在地','家庭常驻地址','入园年份','操作'];

    window.calcNFTotal = function(){
        var t=0;
        students.forEach(function(r){window.newFeeState.items.forEach(function(feeId){if(feeId==='baoyu'){t+=r.ba;}else{var b=studentBalances[r.n]||0;t+=Math.max(0,r.can-b);}});});
        var te=document.getElementById('nf-total-'+genId);if(te)te.textContent='¥'+t.toFixed(2);
    };
}

function saveStudentArchive(idx){
    const get=(id)=>document.getElementById(id);
    if(idx===-1){
        const onlyVal=document.querySelector('#sv_only')?document.querySelector('#sv_only').value:'是';
        studentData.push({
            n:get('sv_n').value.trim()||'新生', g:get('sv_g').value, birth:get('sv_birth').value,
            b:get('sv_b').value, idType:get('sv_idType').value, idNo:get('sv_idNo').value,
            nat:get('sv_nat').value, eth:get('sv_eth').value, ori:get('sv_ori').value,
            reg:get('sv_reg').value, addr:get('sv_addr').value, y:get('sv_y').value,
            c:get('sv_c').value, bal:'¥'+parseFloat(get('sv_bal').value||0).toFixed(2),
            type:get('sv_type').value,
            email:get('sv_email')?get('sv_email').value:'',
            onlyChild:onlyVal,
            parent:get('sv_parent').value, parentG:get('sv_parentG').value,
            parentWork:get('sv_parentWork').value, parentWorkNo:get('sv_parentWorkNo')?get('sv_parentWorkNo').value:'', parentIdType:get('sv_parentIdType').value,
            parentIdNo:get('sv_parentIdNo').value, parentPhone:get('sv_parentPhone').value,
            parentEdu:get('sv_parentEdu').value,
            spouse:get('sv_spouse').value, spousePhone:get('sv_spousePhone').value,
            spouseWork:get('sv_spouseWork').value, spouseIdType:get('sv_spouseIdType').value,
            spouseIdNo:get('sv_spouseIdNo').value, spouseEdu:get('sv_spouseEdu').value,
            otherHistory:document.querySelector('#sv_otherHistory')?document.querySelector('#sv_otherHistory').value:'无'
        });
    }else{
        const s=studentData[idx];
        s.g=get('sv_g').value; s.birth=get('sv_birth').value; s.b=get('sv_b').value;
        s.nat=get('sv_nat').value; s.eth=get('sv_eth').value; s.ori=get('sv_ori').value;
        s.reg=get('sv_reg').value; s.addr=get('sv_addr').value; s.y=get('sv_y').value;
        s.c=get('sv_c').value; s.bal='¥'+parseFloat(get('sv_bal').value||0).toFixed(2);
        s.type=get('sv_type').value;
        s.relation=get('sv_relation')?get('sv_relation').value:s.relation;
        s.email=get('sv_email')?get('sv_email').value:s.email;
        s.onlyChild=get('sv_only')?get('sv_only').value:s.onlyChild;
        s.parent=get('sv_parent').value; s.parentG=get('sv_parentG').value;
        s.parentWork=get('sv_parentWork').value; s.parentWorkNo=get('sv_parentWorkNo')?get('sv_parentWorkNo').value:s.parentWorkNo;
        s.parentIdType=get('sv_parentIdType').value;
        s.parentIdNo=get('sv_parentIdNo').value; s.parentPhone=get('sv_parentPhone').value;
        s.parentEdu=get('sv_parentEdu').value;
        s.spouse=get('sv_spouse').value; s.spousePhone=get('sv_spousePhone').value;
        s.spouseWork=get('sv_spouseWork').value; s.spouseIdType=get('sv_spouseIdType').value;
        s.spouseIdNo=get('sv_spouseIdNo').value; s.spouseEdu=get('sv_spouseEdu').value;
        if(document.querySelector('#sv_otherHistory')) s.otherHistory=document.querySelector('#sv_otherHistory').value;
    }
    closeDrawer();
    document.querySelector('#admin-content').innerHTML=renderStudentArchive();
    toast(idx===-1?'学生档案已创建':'学生档案已更新','success');
}

function getTargetClass(c){
    if(c==='托班') return '小班';
    if(c==='小班') return '中班';
    if(c==='中班') return '大班';
    if(c==='大班') return '🎓 毕业';
    return c;
}
function openBatchPromote(){
    window._bpAll = studentData.map(s => ({
        name: s.n, cls: s.c, target: getTargetClass(s.c), id: s.n, idNo: s.idNo||''
    }));
    window._bpR = [];
    function renderTransfer(){
        const lf = (window._leftF||'').toLowerCase(), rf = (window._rightF||'').toLowerCase();
        const all = window._bpAll, rr = window._bpR;
        const left = all.filter(x => !rr.includes(x.id) && (!lf || x.name.includes(lf) || x.idNo.includes(lf)));
        const right = all.filter(x => rr.includes(x.id) && (!rf || x.name.includes(rf) || x.idNo.includes(rf)));

        function stat(arr){ let s={}; arr.forEach(x=>{let k=x.cls+'→'+x.target; s[k]=(s[k]||0)+1;}); return s; }
        // 统计基于全部数据（忽略搜索过滤）
        const promoteAll = all.filter(x => !rr.includes(x.id));
        const ps = stat(promoteAll);
        const summary = Object.keys(ps).map(k=>k+' '+ps[k]+'人').join('，') + (rr.length ? ' ｜ 不升班：'+rr.length+'人' : '');

        const btnText = right.length === all.length ? '全部不升班，无需操作' : '确认升班 '+(all.length-right.length)+' 人';

        openDrawer('批量升班',
            `<div style="margin-bottom:12px;font-size:13px;color:var(--text-tertiary)">左侧全选为升班学生，取消勾选则移至右侧不升班；支持按姓名/证件号搜索</div>
            <div style="display:flex;gap:12px;min-height:320px">
                <div style="flex:1;border:1px solid var(--border-split);border-radius:var(--radius);display:flex;flex-direction:column">
                    <div style="padding:8px 12px;border-bottom:1px solid var(--border-split);font-weight:600;font-size:13px;background:#FAFAFA">升班学生（${left.length}）</div>
                    <div style="padding:6px 12px;border-bottom:1px solid var(--border-split)"><input placeholder="搜索姓名/证件号" style="width:100%;height:28px;padding:0 8px;border:1px solid var(--border);border-radius:4px;font-size:12px" oninput="window._leftF=this.value" onchange="openBatchPromote._r()"></div>
                    <div style="flex:1;overflow-y:auto;padding:4px">${left.map(x=>`<label style="display:flex;align-items:center;padding:6px 8px;cursor:pointer;border-radius:4px;transition:background .1s" onmouseover="this.style.background='#F5F5F5'" onmouseout="this.style.background=''"><input type="checkbox" checked style="margin-right:8px" onchange="if(!this.checked){window._bpR.push('${x.id}');window._leftF='';openBatchPromote._r();}"><div><div style="font-size:13px;font-weight:500">${x.name}</div><div style="font-size:11px;color:var(--text-tertiary)">${x.idNo} ｜ ${x.cls} → ${x.target}</div></div></label>`).join('')||'<div style="color:var(--text-tertiary);text-align:center;padding:24px;font-size:13px">暂无匹配学生</div>'}</div>
                </div>

function confirmBatchPromote(){
    const all = window._bpAll, rr = window._bpR;
    const nPromote = all.length - rr.length;
    const promoteStats = all.filter(x => !rr.includes(x.id)).reduce(function(s,x){
        var k = x.cls+'→'+x.target; s[k]=(s[k]||0)+1; return s;
    }, {});
    const statStr = Object.keys(promoteStats).map(function(k){return k+' '+promoteStats[k]+'人'}).join('，');
    const stayNames = rr.length ? all.filter(x => rr.includes(x.id)).map(function(x){return x.name}).join('、') : '';
    var h = '<div style="font-size:14px;line-height:2"><p>确认执行批量升班操作？</p>';
    h += '<p style="font-size:13px;color:var(--text-secondary)">升班学生：'+nPromote+'人（'+statStr+'）</p>';
    if(stayNames) h += '<p style="font-size:13px;color:var(--error)">不升班学生（'+rr.length+'人）：'+stayNames+'</p>';
    h += '</div>';
    var toastMsg = '升班操作完成：'+nPromote+'人已升级';
    if(rr.length) toastMsg += ','+rr.length+'人保持原班级';
    openModal('确认批量升班', h,
        '<button class="btn btn-default" onclick="closeModal()">取消</button>'+
        '<button class="btn btn-primary" onclick="closeModal();closeDrawer();toast(\''+toastMsg+'\',\'success\')">确认升班</button>'
    );
}

    var n=document.getElementById('semesterName').value.trim();
    var s=document.getElementById('semesterStart').value;
    var e=document.getElementById('semesterEnd').value;
    if(!n||!s||!e){toast('请填写完整信息','error');return;}
    if(s>=e){toast('结束日期必须晚于开始日期','error');return;}
    if(idx>=0) semesters[idx]={...semesters[idx],name:n,start:s,end:e};
    else semesters.push({name:n,start:s,end:e,fees:[
        {cls:'小班',b:'0.00',f:'0.00'},{cls:'中班',b:'0.00',f:'0.00'},{cls:'大班',b:'0.00',f:'0.00'}
    ]});
    closeModal();
    document.querySelector('#admin-content').innerHTML=renderSemesterManage();
    toast(idx>=0?'学期已更新':'学期已新增','success');
}
function confirmDelSemester(idx){
    openModal('确认删除', '确定要删除学期「'+semesters[idx].name+'」吗？删除后不可恢复。',
        '<button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="delSemester('+idx+')">确定删除</button>'
    );
}
function delSemester(idx){
    semesters.splice(idx,1);
    closeModal();
    document.querySelector('#admin-content').innerHTML=renderSemesterManage();
    toast('已删除','success');
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', ()=>{ navTo('review-list'); });
</script>
</body>
</html>
